version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: schoolportal-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - schoolportal-network
    restart: unless-stopped

  students-mvc:
    build:
      context: .
      dockerfile: SchoolPortal.Students/Dockerfile
    container_name: schoolportal-students
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${STUDENTS_CONNECTION_STRING}
    depends_on:
      - sqlserver
    networks:
      - schoolportal-network
    restart: unless-stopped

  grades-mvc:
    build:
      context: .
      dockerfile: SchoolPortal.Grades/Dockerfile
    container_name: schoolportal-grades
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__StudentsUrl=http://students-mvc:8080
      - ConnectionStrings__DefaultConnection=${GRADES_CONNECTION_STRING}
    depends_on:
      - sqlserver
      - students-mvc
    networks:
      - schoolportal-network
    restart: unless-stopped

networks:
  schoolportal-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local